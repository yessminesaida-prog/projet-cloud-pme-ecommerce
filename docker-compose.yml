services:
  catalogue:
    build: ./catalogue
    container_name: ms-catalogue
    ports:
      - "5001:5001"
    volumes:
      - catalogue_data:/data
    environment:
      - DB_PATH=/data/catalogue.db
    networks:
      - pme_cloud_net

  commandes:
    build: ./commandes
    container_name: ms-commandes
    ports:
      - "5002:5002"
    volumes:
      - commandes_data:/data
    environment:
      - DB_PATH=/data/commandes.db
      - CATALOGUE_URL=http://catalogue:5001
      - NOTIFICATIONS_URL=http://notifications:5003
    depends_on:
      - catalogue
      - notifications
    networks:
      - pme_cloud_net

  notifications:
    build: ./notifications
    container_name: ms-notifications
    ports:
      - "5003:5003"
    volumes:
      - notifications_data:/data
    environment:
      - DB_PATH=/data/notifications.db
    networks:
      - pme_cloud_net

volumes:
  catalogue_data:
  commandes_data:
  notifications_data:

networks:
  pme_cloud_net:
    driver: bridge